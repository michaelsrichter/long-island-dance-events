# Secret-scanning rules (gitleaks). Start from the default rules and allow only known public values.
[extend]
useDefault = true

[[allowlists]]
description = "Public Microsoft Graph delegated-permission IDs (openid, offline_access, profile, email, User.Read). The same for every tenant; not secrets."
regexTarget = "secret"
regexes = [
  '''^37f7f235-527c-4136-accd-4a02d197296e$''',
  '''^7427e0e9-2fba-42fe-b0c0-848c9e6a8182$''',
  '''^14dad69e-099b-42c9-810b-d002981feec1$''',
  '''^64a6cdd6-aab1-4aaf-94b8-3cc8405e90d0$''',
  '''^e1fe6dd8-ba31-4d61-89e7-88639da4683d$''',
]
