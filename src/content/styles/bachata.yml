name: Bachata
family: latin
danceType: partner
order: 31
aliases:
  - Bachata
  - Sensual Bachata
summary: A close partner dance from the Dominican Republic with a small hip pop on count four.
music: Bachata and Latin pop
description: Bachata is a partner dance from the Dominican Republic, danced to bachata music. The basic step moves side to side over eight counts, with a small hip pop on counts 4 and 8. It began in the 1960s as a close-embrace dance and today ranges from traditional Dominican footwork to the slower, flowing sensual style.
