summary: A slow, relaxed partner dance to blues music, with lots of room to improvise.
music: Blues
description: Blues dancing is a relaxed, grounded partner dance done to slow blues music. Couples often dance in a close embrace and improvise, pulsing with the beat and playing with the music's mood. It grew out of African American social dances from the early 1900s, and today's scenes often mix it with fusion dancing.
