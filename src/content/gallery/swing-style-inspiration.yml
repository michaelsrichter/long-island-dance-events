title: Swing style inspiration
description: Sample open-licensed photos from the 2018 Lindy Bout swing dance competition in Vancouver, Canada. They demonstrate the gallery and slideshow layout.
order: 10
published: true
homepageSlideshow: true
source: Wikimedia Commons, photos by Thomas Quine, CC BY 2.0.
rightsNote: Free to use with credit (CC BY 2.0). Keep the photographer credit and license link with each photo.
