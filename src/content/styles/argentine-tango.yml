summary: A slow, close partner dance from Buenos Aires. The couple walks and improvises together.
music: Tango, vals and milonga
description: Argentine tango is a close, walking partner dance where couples share an embrace and improvise together as they move counterclockwise around the floor. It began in the working-class neighborhoods of Buenos Aires in the late 1800s. A social tango dance is called a milonga, and dancers move to tango, vals (waltz) and milonga music.
