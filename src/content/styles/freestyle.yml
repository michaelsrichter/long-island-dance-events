summary: Dance however you like to a live band or DJ, like at a club, bar or wedding. No steps or partner needed.
description: |-
  This is the dancing most people already know: moving to the music in front of a cover band or DJ, alone, with friends or with a date. There are no set steps to learn.

  On this site, "Party dancing" marks live-music nights and DJ parties where people get up and dance. Each listing also shows a dancing score, because not every concert has room or a crowd that dances.
music: Rock, pop, disco, Motown, 80s, country and dance hits played by cover bands and DJs
