name: Lindy Hop
family: swing
danceType: partner
order: 10
aliases:
  - Lindy
  - Lindy Hop
  - Lindyhop
summary: The original swing dance from 1920s Harlem in New York City. It is bouncy and playful.
music: Big-band swing and jazz
description: Lindy Hop is the original swing dance, born in the African American dance halls of Harlem, New York City, in the late 1920s. It is energetic and playful, mixing eight-count swingouts with six-count moves, kicks and room for improvising. It is danced to big-band swing and jazz, and was hugely popular in the late 1930s and early 1940s.
