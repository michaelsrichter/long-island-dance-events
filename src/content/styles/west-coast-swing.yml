name: West Coast Swing
family: swing
danceType: partner
order: 12
aliases:
  - West Coast Swing
  - WCS
  - West Coast
summary: A smooth swing dance done in a straight line. It fits pop, R&B and blues songs.
music: Pop, R&B, blues, country
description: West Coast Swing is a smooth, stretchy partner dance done in a narrow lane, or slot, on the floor, with lots of room for both partners to improvise. It grew out of the Lindy Hop in California in the 1940s and 1950s. Today people dance it to pop, R&B, blues and country songs.
