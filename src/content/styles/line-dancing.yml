summary: Everyone dances the same steps in rows. No partner is needed.
music: Country, pop, oldies
description: Line dancing is a group dance where everyone does the same steps at the same time, standing in rows that usually face the same way. No partner is needed. Each dance is a short pattern that repeats and is often tied to one song. It is a favorite at country bars, but many line dances are done to pop and oldies too.
