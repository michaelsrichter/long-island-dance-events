question: Do I need an account?
answer: No. Everything on this site is free to read without signing in. An account is only needed to **like** a page, leave a **note**, send a **private correction** or share a **photo**. Sign in from the "Dancers' notes and photos" box on any event, venue, teacher, band or style page. We email you a one-time code; there is no password. See the [community rules](/community-rules/) and [what we keep](/privacy/#accounts).
