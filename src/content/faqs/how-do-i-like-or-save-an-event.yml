question: How do I like or save an event?
answer: |-
  Tap **Like** on any event, place, teacher, band or dance style to show you enjoyed it. The number next to the heart is how many people liked it. Each person can like something only once; tap it again to take your like back.

  Tap **Save** on any upcoming event to keep it on your [Saved events](/saved/) page with its next date. Only you can see your saved events. A repeating event, like a weekly social, stays saved week after week.

  Liking and saving need a free account (we email you a one-time code; there is no password). Browsing never needs one.
