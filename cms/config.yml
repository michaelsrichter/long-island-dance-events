# Decap CMS configuration for Long Island Dance Events.
# Editors sign in with GitHub at /admin/. Every change becomes a pull request (editorial workflow),
# is checked by automated tests, gets a preview website, and goes live when it is published (merged).
# The weekly scrape writes the same JSON files. Fields listed in "Locked fields" are never overwritten by it.
backend:
  name: github
  repo: michaelsrichter/long-island-dance-events
  branch: main
  # The repository is public, so editors only need "public_repo" access. The default ("repo") would
  # also give the editor's sign-in access to every private repository on their GitHub account.
  auth_scope: public_repo
  # base_url and auth_endpoint are set at runtime in /admin/init.js to this site's /api/auth function.
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'

publish_mode: editorial_workflow
show_preview_links: true
locale: en

media_folder: src/assets/uploads
public_folder: ../../assets/uploads

editor:
  preview: true

# ---------- Reusable field groups ----------
x-time: &time
  widget: datetime
  date_format: false
  time_format: 'h:mm A'
  format: 'HH:mm'
  picker_utc: false
  required: false

x-local-datetime: &local-datetime
  widget: datetime
  date_format: 'YYYY-MM-DD'
  time_format: 'h:mm A'
  format: 'YYYY-MM-DDTHH:mm'
  picker_utc: false

x-date: &date
  widget: datetime
  date_format: 'YYYY-MM-DD'
  time_format: false
  format: 'YYYY-MM-DD'
  picker_utc: false

x-aliases: &aliases
  label: 'Other names used in listings'
  name: aliases
  widget: list
  required: false
  hint: 'Spellings the weekly scrape should recognize, for example "Club Brumidi". One per line.'

x-socials: &socials
  - { label: 'Website', name: website, widget: string, required: false }
  - { label: 'Facebook page', name: facebookUrl, widget: string, required: false }
  - { label: 'Instagram page', name: instagramUrl, widget: string, required: false }
  - { label: 'YouTube channel', name: youtubeUrl, widget: string, required: false }
  - { label: 'TikTok page', name: tiktokUrl, widget: string, required: false }
  - { label: 'X (Twitter) page', name: xUrl, widget: string, required: false }
  - label: 'More links'
    name: moreLinks
    widget: list
    required: false
    fields:
      - { label: 'Label', name: label, widget: string }
      - { label: 'Web address', name: url, widget: string }

# One photo or logo: the file plus the words that go with it. The file is saved next to the other
# images of this kind (src/assets/entities/<kind>/) and resized for phones when the site is built.
x-photo-fields: &photo-fields
  # Uploaded photos are resized to 1600 pixels wide and saved as JPG without camera data (location, date, camera).
  - { label: 'Photo', name: image, widget: image, choose_url: false, media_processing: { enabled: true, format: { enabled: true, default: jpeg }, quality: 82, strip_metadata: true, width: 1600 }, hint: 'JPG, PNG or WebP, at least 600 pixels wide. It is resized and saved as a JPG when you upload it; the site makes smaller copies for phones.' }
  - { label: 'Alt text', name: alt, widget: string, hint: 'Describe the photo in plain words for people who cannot see it, for example "The brick front of the hall with a red awning".' }
  - { label: 'Credit', name: credit, widget: string, hint: 'Required. Shown under the photo, for example "Photo: The Nutty Irishman (website)" or "Photo: Jane Doe, CC BY-SA 4.0, via Wikimedia Commons".' }
  - { label: 'Credit link', name: creditUrl, widget: string, required: false, hint: 'The page where you found the photo.' }
  - { label: 'License link (Creative Commons photos only)', name: licenseUrl, widget: string, required: false }
  - { label: 'Original file address (not shown)', name: imageSource, widget: string, required: false, hint: 'Web address of the original image file, for our records.' }
  - { label: 'Caption', name: caption, widget: string, required: false }
  - { label: 'Focus point', name: focus, widget: string, required: false, pattern: ['^\d{1,3}% \d{1,3}%$', 'Two percentages, for example 50% 30%'], hint: 'What to keep in view when the photo is cropped to a wide box: across, then down from the top-left. "50% 30%" keeps the upper middle.' }

x-photos: &photos
  label: 'Photos'
  name: photos
  widget: list
  required: false
  collapsed: true
  max: 6
  summary: '{{fields.alt}}'
  hint: 'Up to 6. The first photo shows on the card in the list and at the top of the page. Only use photos the owner put on their own website or page, or openly licensed ones. Never photos of children or photos other people posted in reviews.'
  fields: *photo-fields

x-logo: &logo
  label: 'Logo'
  name: logo
  widget: object
  required: false
  collapsed: true
  hint: 'Their own logo, from their website. Also fill in the alt text (for example "The Nutty Irishman logo"); if you leave it empty the site says "<name> logo".'
  fields:
    - { label: 'Logo file', name: image, widget: image, required: false, choose_url: false, hint: 'PNG, SVG or JPG. A square-ish logo at least 200 pixels wide works best.' }
    - { label: 'Alt text', name: alt, widget: string, required: false, hint: 'Needed when there is a logo. Usually "<name> logo".' }
    - { label: 'Credit', name: credit, widget: string, required: false, hint: 'For example "Logo: The Nutty Irishman".' }
    - { label: 'Credit link', name: creditUrl, widget: string, required: false, hint: 'The page where you found the logo.' }
    - { label: 'Original file address (not shown)', name: imageSource, widget: string, required: false }

x-entity-sources: &entity-sources
  - label: 'Sources for these details'
    name: evidence
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.url}}'
    hint: 'Web pages that show the address, phone, links or photos. Every fact needs a source.'
    fields:
      - { label: 'Web page', name: url, widget: string }
      - { label: 'What it shows (our own words)', name: note, widget: string, hint: 'Under 240 characters.' }
  - { label: 'Checked on (shown on the page)', name: factsSource, widget: string, required: false, hint: 'For example "Checked October 4, 2026. Sources: their website and Facebook page."' }

x-hours: &hours
  { label: 'Opening hours', name: hours, widget: string, required: false, hint: 'Short and plain, for example "Tue-Sun 4 PM-midnight; closed Mon". Leave empty if they do not publish hours.' }

x-seo: &seo
  - { label: 'Search title (optional)', name: seoTitle, widget: string, required: false, hint: 'Under 70 characters.' }
  - { label: 'Search description (optional)', name: seoDescription, widget: text, required: false, hint: 'Under 170 characters.' }

x-evidence: &evidence
  label: 'How we know (sources)'
  name: evidence
  widget: list
  required: false
  collapsed: true
  summary: '{{fields.url}}'
  fields:
    - { label: 'Web page', name: url, widget: string, hint: 'Venue site, review, news story or public photo page.' }
    - { label: 'What it shows (our own words)', name: note, widget: string, hint: 'Under 240 characters.' }

x-dance-kinds: &dance-kinds
  label: 'Kinds of dancing'
  name: kinds
  widget: select
  multiple: true
  required: false
  options:
    - { label: 'Partner dancing (swing, salsa, ballroom, hustle, tango...)', value: partner }
    - { label: 'Line dancing', value: line }
    - { label: 'Party dancing (freestyle, like at a club or wedding)', value: freestyle }

x-research-confidence: &research-confidence
  label: 'How sure are we?'
  name: confidence
  widget: select
  default: low
  options: [high, medium, low]

x-review: &review
  label: 'Notes for editors (never shown publicly)'
  name: reviewNotes
  widget: text
  required: false

x-styles: &style-relation
  widget: relation
  collection: styles
  value_field: '{{slug}}'
  search_fields: [name, aliases]
  display_fields: [name]
  multiple: true
  required: false

collections:
  - name: events
    label: Events
    label_singular: Event
    description: 'One file per event. A repeating event (like every Tuesday) is one file with a repeat rule. Set the status to "Waiting for review" to hide an event.'
    folder: src/content/events
    extension: json
    format: json
    create: true
    identifier_field: title
    slug: '{{fields.start | date("YYYY-MM-DD")}}-{{slug}}'
    summary: '{{start}} · {{title}} ({{status}})'
    sortable_fields: [start, title, lastSeen]
    view_filters:
      - { label: 'Waiting for review', field: status, pattern: 'pending-review' }
      - { label: 'Listed', field: status, pattern: 'active' }
      - { label: 'Cancelled', field: status, pattern: 'cancelled' }
      - { label: 'Past', field: status, pattern: 'past' }
    view_groups:
      - { label: 'Source', field: sourceId }
    fields:
      - { label: 'Title', name: title, widget: string, hint: 'Plain and specific, for example "Hustle class at The DancXchange Dance Studio".' }
      - { label: 'Summary (in our own words)', name: summary, widget: text, hint: '1 to 3 short sentences. Never copy text from the source.' }
      - label: 'Type of event'
        name: category
        widget: select
        options:
          - { label: 'Social dance', value: social-dance }
          - { label: 'Class or lesson', value: class-lesson }
          - { label: 'Lesson + dance party', value: lesson-party }
          - { label: 'Live music', value: live-music }
          - { label: 'Festival or weekend event', value: festival }
      - { label: 'Dance styles', name: danceStyles, <<: *style-relation }
      - { label: 'Starts', name: start, <<: *local-datetime, hint: 'Local Long Island time. For a repeating event, the first date.' }
      - { label: 'Ends', name: end, <<: *local-datetime, required: false }
      - { label: 'Time zone', name: timezone, widget: hidden, default: 'America/New_York' }
      - label: 'Repeats'
        name: recurrence
        widget: object
        required: false
        collapsed: true
        hint: 'Leave empty for a one-time event.'
        fields:
          - { label: 'Repeat rule', name: rrule, widget: string, required: false, hint: 'For example FREQ=WEEKLY;BYDAY=TU;UNTIL=20261027 (every Tuesday until Oct 27) or FREQ=MONTHLY;BYDAY=1FR,3FR (1st and 3rd Fridays).' }
          - { label: 'Extra dates', name: rdates, widget: list, required: false, hint: 'YYYY-MM-DD, one per line.' }
          - { label: 'Skipped dates', name: exdates, widget: list, required: false, hint: 'YYYY-MM-DD dates with no event, one per line.' }
      - { label: 'How often (in plain words)', name: cadence, widget: string, required: false, hint: 'Only if the repeat rule cannot say it, for example "1st and 3rd Fridays".' }
      - { label: 'Lesson starts', name: lessonTime, <<: *time }
      - { label: 'Venue', name: venueId, widget: relation, collection: venues, value_field: '{{slug}}', search_fields: [name, town, aliases], display_fields: ['{{name}}, {{town}}'], required: false }
      - { label: 'Town (if the venue is unknown)', name: town, widget: string, required: false }
      - { label: 'Organizer', name: organizerId, widget: relation, collection: organizers, value_field: '{{slug}}', search_fields: [name, aliases], display_fields: [name], required: false }
      - { label: 'Bands and DJs', name: performerIds, widget: relation, collection: performers, value_field: '{{slug}}', search_fields: [name, aliases], display_fields: [name], multiple: true, required: false }
      - { label: 'Teachers', name: instructorIds, widget: relation, collection: instructors, value_field: '{{slug}}', search_fields: [name, aliases], display_fields: [name], multiple: true, required: false }
      - { label: 'Price per person (lowest, US $)', name: price, widget: number, value_type: float, min: 0, required: false }
      - { label: 'Highest price (US $)', name: priceMax, widget: number, value_type: float, min: 0, required: false }
      - { label: 'Free event', name: isFree, widget: boolean, required: false }
      - { label: 'Price notes', name: priceNotes, widget: string, required: false, hint: 'For example "Members pay less" or "$30 per couple".' }
      - label: 'Level'
        name: skillLevel
        widget: select
        default: all-levels
        options:
          - { label: 'All levels welcome', value: all-levels }
          - { label: 'Beginner', value: beginner }
          - { label: 'Intermediate', value: intermediate }
          - { label: 'Advanced', value: advanced }
          - { label: 'Several levels', value: mixed }
      - label: 'Ages'
        name: ageGroup
        widget: select
        required: false
        options:
          - { label: 'Adults', value: adults }
          - { label: 'Children', value: kids }
          - { label: 'Teens', value: teens }
          - { label: 'All ages', value: all-ages }
      - { label: 'Tickets link', name: ticketUrl, widget: string, required: false }
      - { label: 'More information link', name: infoUrl, widget: string, required: false }
      - { label: "Contact phone (if not the organizer's)", name: contactPhone, widget: string, required: false }
      - { label: "Contact email (if not the organizer's)", name: contactEmail, widget: string, required: false }
      - label: 'Status'
        name: status
        widget: select
        default: active
        options:
          - { label: 'Listed', value: active }
          - { label: 'Past', value: past }
          - { label: 'Cancelled', value: cancelled }
          - { label: 'Waiting for review (hidden)', value: pending-review }
      - { label: 'Cancellation note', name: cancelledNote, widget: string, required: false }
      - { label: 'Source', name: sourceId, widget: relation, collection: sources, value_field: '{{slug}}', search_fields: [name], display_fields: [name] }
      - { label: 'Source link', name: sourceUrl, widget: string, hint: 'The page or file where this listing was found.' }
      - { label: 'Source name', name: sourceName, widget: string, required: false, hint: 'For example "The Dance Calendar, October 2026".' }
      - { label: 'Where in the source', name: sourceRef, widget: string, required: false, hint: 'For example "page 17".' }
      - { label: 'First seen', name: firstSeen, <<: *date }
      - { label: 'Last seen', name: lastSeen, <<: *date }
      - label: 'Can you dance here? (your answer)'
        name: dancing
        widget: object
        required: false
        collapsed: true
        hint: 'Fill this in only to correct the automatic dancing score. Leave it empty to let the site work it out.'
        fields:
          - { label: 'Dancing chance (0 = none, 1 = sure)', name: likelihood, widget: number, value_type: float, min: 0, max: 1, step: 0.1 }
          - *dance-kinds
          - { label: 'Why (shown to visitors)', name: notes, widget: string, required: false }
      - { label: 'Dancing hints from the listing', name: dancingCues, widget: select, multiple: true, required: false, options: [dj, dance-party, theater, library, brunch, festival, outdoor, tribute, acoustic, jam, afternoon], hint: 'Set by the weekly scrape.' }
      - { label: 'Confidence (0 to 1)', name: confidence, widget: number, value_type: float, min: 0, max: 1, default: 1, hint: 'How sure the scrape was. Below 0.6 the event waits for review.' }
      - label: 'Locked fields'
        name: lockedFields
        widget: select
        multiple: true
        required: false
        hint: 'Fields you fixed by hand. The weekly scrape will not change them. Add "status" after you approve an event.'
        options: [title, summary, category, danceStyles, start, end, recurrence, cadence, lessonTime, venueId, town, organizerId, performerIds, instructorIds, price, priceMax, isFree, priceNotes, skillLevel, ageGroup, ticketUrl, infoUrl, contactPhone, contactEmail, status, sourceUrl, sourceName, sourceRef, dancingCues, dancing, confidence, reviewNotes]
      - { label: 'Merged duplicates', name: mergedFrom, widget: list, required: false, hint: 'Ids of duplicate listings that were combined into this one.' }
      - { label: 'Scrape match key', name: matchKey, widget: string, required: false, hint: 'Used by the weekly scrape to find this listing again. Do not change it.' }
      - *review
      - *seo

  - name: venues
    label: Venues
    label_singular: Venue
    folder: src/content/venues
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: '{{slug}}-{{fields.town}}'
    summary: '{{name}}, {{town}}'
    sortable_fields: [name, town]
    media_folder: '/src/assets/entities/venues'
    public_folder: '../../assets/entities/venues'
    fields:
      - { label: 'Name', name: name, widget: string }
      - *aliases
      - { label: 'Street address', name: address, widget: string }
      - { label: 'Town', name: town, widget: string }
      - { label: 'County', name: county, widget: select, options: [Nassau, Suffolk] }
      - { label: 'State', name: state, widget: string, default: 'NY' }
      - { label: 'ZIP code', name: postalCode, widget: string, required: false }
      - { label: 'Phone', name: phone, widget: string, required: false, hint: 'The business phone, for example (631) 476-3707.' }
      - { label: 'Public email', name: email, widget: string, required: false, hint: 'Only an email the venue publishes for the public.' }
      - *socials
      - *hours
      - { label: 'Latitude', name: latitude, widget: number, value_type: float, required: false, hint: 'Filled in automatically. Leave empty and the weekly job will look it up.' }
      - { label: 'Longitude', name: longitude, widget: number, value_type: float, required: false }
      - { label: 'Where the map position came from', name: coordinatesSource, widget: string, required: false }
      - { label: 'Google Maps link (photos and reviews)', name: googleMapsUrl, widget: string, required: false }
      - { label: 'Parking', name: parkingNotes, widget: text, required: false }
      - { label: 'Accessibility', name: accessibilityNotes, widget: text, required: false }
      - { label: 'Good to know', name: description, widget: text, required: false }
      - *logo
      - *photos
      - label: 'Kind of place'
        name: kind
        widget: select
        required: false
        options: [bar, restaurant, nightclub, brewery, winery, distillery, theater, concert-hall, park, beach, library, lodge-hall, dance-studio, school, festival, marina-club, other]
      - label: 'Dancing here'
        name: dancing
        widget: object
        required: false
        collapsed: true
        hint: 'Is there room to dance, and what kind of dancing happens? Used for the dancing score on events here.'
        fields:
          - label: 'Room to dance'
            name: floor
            widget: select
            default: unknown
            options:
              - { label: 'Has a dance floor', value: dance-floor }
              - { label: 'Room to dance near the band', value: open-space }
              - { label: 'Small space; a few people dance', value: small }
              - { label: 'Mostly seats; little or no dancing', value: seated }
              - { label: 'Not sure yet', value: unknown }
          - { label: 'Does the venue want people to dance?', name: policy, widget: select, default: unknown, options: [encouraged, allowed, discouraged, unknown] }
          - *dance-kinds
          - { label: 'What we found (our own words)', name: notes, widget: text, required: false, hint: 'One or two plain sentences. Shown on the venue page.' }
          - *evidence
          - *research-confidence
          - { label: 'Checked on', name: checked, <<: *date, required: false }
      - *entity-sources
      - *seo
      - *review

  - name: organizers
    label: Organizers
    label_singular: Organizer
    description: 'Studios, clubs, DJs and teachers who run events. Turn on "Opted out" to stop listing their events.'
    folder: src/content/organizers
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: '{{name}} ({{type}})'
    sortable_fields: [name]
    media_folder: '/src/assets/entities/organizers'
    public_folder: '../../assets/entities/organizers'
    fields:
      - { label: 'Name', name: name, widget: string }
      - label: 'Type'
        name: type
        widget: select
        options:
          - { label: 'Dance studio', value: studio }
          - { label: 'Dance club', value: club }
          - { label: 'Nonprofit group', value: nonprofit }
          - { label: 'Event promoter', value: promoter }
          - { label: 'Venue', value: venue }
          - { label: 'School or college', value: school }
          - { label: 'DJ', value: dj }
          - { label: 'Teacher', value: instructor }
          - { label: 'Other', value: other }
      - *aliases
      - *socials
      - { label: 'Public email', name: email, widget: string, required: false, hint: 'Only an email they publish for the public. Never a private address.' }
      - { label: 'Public phone', name: phone, widget: string, required: false, hint: 'Only a business number they publish.' }
      - { label: 'Street address (their own studio)', name: address, widget: string, required: false, hint: 'Leave empty if they meet at a venue; choose the usual venue below instead. Never a home address.' }
      - { label: 'Town', name: town, widget: string, required: false }
      - { label: 'ZIP code', name: postalCode, widget: string, required: false }
      - { label: 'County', name: county, widget: select, options: [Nassau, Suffolk], required: false }
      - *hours
      - { label: 'Usual venue', name: homeVenueId, widget: relation, collection: venues, value_field: '{{slug}}', search_fields: [name, town], display_fields: ['{{name}}, {{town}}'], required: false }
      - { label: 'Dance styles', name: danceStyles, <<: *style-relation }
      - { label: 'Description (our own words)', name: description, widget: text, required: false }
      - *logo
      - *photos
      - { label: 'Opted out (do not list their events)', name: optOut, widget: boolean, default: false }
      - *entity-sources
      - *seo
      - *review

  - name: instructors
    label: Teachers
    label_singular: Teacher
    folder: src/content/instructors
    extension: json
    format: json
    create: true
    identifier_field: name
    sortable_fields: [name]
    media_folder: '/src/assets/entities/instructors'
    public_folder: '../../assets/entities/instructors'
    fields:
      - { label: 'Name', name: name, widget: string }
      - *aliases
      - { label: 'Dance styles taught', name: styles, <<: *style-relation }
      - { label: 'Teaches with', name: affiliatedOrganizerIds, widget: relation, collection: organizers, value_field: '{{slug}}', search_fields: [name], display_fields: [name], multiple: true, required: false }
      - { label: 'Home town', name: town, widget: string, required: false, hint: 'Town only. Never a street address.' }
      - *socials
      - { label: 'Lessons or booking page', name: bookingUrl, widget: string, required: false }
      - { label: 'Lessons email', name: email, widget: string, required: false, hint: 'Only if the teacher publishes it for lessons. Never a private email.' }
      - { label: 'Lessons phone', name: phone, widget: string, required: false, hint: 'Only if the teacher publishes it for lessons. Never a private number.' }
      - { label: 'Description (our own words)', name: description, widget: text, required: false }
      - { <<: *logo, hint: 'Only if the teacher runs their own school or brand. If you add one, also fill in the alt text.' }
      - *photos
      - *entity-sources
      - *seo
      - *review

  - name: performers
    label: Bands and DJs
    label_singular: Band or DJ
    folder: src/content/performers
    extension: json
    format: json
    create: true
    identifier_field: name
    sortable_fields: [name]
    media_folder: '/src/assets/entities/performers'
    public_folder: '../../assets/entities/performers'
    fields:
      - { label: 'Name', name: name, widget: string }
      - label: 'Type'
        name: type
        widget: select
        options:
          - { label: 'Band', value: band }
          - { label: 'DJ', value: dj }
          - { label: 'Singer or solo act', value: solo }
      - *aliases
      - { label: 'Music genres', name: genres, widget: list, required: false }
      - { label: 'Home town', name: town, widget: string, required: false, hint: 'Where they are based, for example "Massapequa". Town only.' }
      - *socials
      - { label: 'Spotify', name: spotifyUrl, widget: string, required: false }
      - { label: 'Bandcamp', name: bandcampUrl, widget: string, required: false }
      - { label: 'Booking page', name: bookingUrl, widget: string, required: false, hint: 'Their own booking or contact page.' }
      - { label: 'Booking email', name: email, widget: string, required: false, hint: 'Only if they publish it for bookings.' }
      - { label: 'Booking phone', name: phone, widget: string, required: false, hint: 'Only if they publish it for bookings.' }
      - { label: 'Description (our own words)', name: description, widget: text, required: false }
      - *logo
      - *photos
      - label: 'Dancing at their shows'
        name: dancing
        widget: object
        required: false
        collapsed: true
        hint: 'Do people dance when they play? Used for the dancing score on their gigs.'
        fields:
          - label: 'Crowd'
            name: rating
            widget: select
            default: unknown
            options:
              - { label: 'Plays for dancers', value: dance-band }
              - { label: 'Party band: crowds often dance', value: party }
              - { label: 'Some people dance', value: mixed }
              - { label: 'Mostly for listening', value: listening }
              - { label: 'Not sure yet', value: unknown }
          - *dance-kinds
          - { label: 'Dance styles at their shows', name: styles, <<: *style-relation }
          - { label: 'What we found (our own words)', name: notes, widget: text, required: false }
          - *evidence
          - *research-confidence
          - { label: 'Checked on', name: checked, <<: *date, required: false }
      - *entity-sources
      - *seo
      - *review

  - name: sources
    label: Sources
    label_singular: Source
    description: 'Calendars the weekly scrape reads. Turn one off to stop reading it. Each source needs a matching adapter in ingest/adapters/.'
    folder: src/content/sources
    extension: json
    format: json
    create: false
    identifier_field: name
    fields:
      - { label: 'Name', name: name, widget: string }
      - { label: 'Web address', name: url, widget: string }
      - { label: 'Kind of source', name: type, widget: select, options: [jsonld, ical, html, pdf, api] }
      - { label: 'Adapter', name: adapter, widget: string, hint: 'File name in ingest/adapters/ without .ts' }
      - label: 'How often'
        name: cadence
        widget: select
        default: weekly
        options:
          - { label: 'Every day', value: daily }
          - { label: 'Twice a week', value: twice-weekly }
          - { label: 'Once a week', value: weekly }
          - { label: 'Once a month', value: monthly }
          - { label: 'Only in season (summer concerts, festivals)', value: seasonal }
          - { label: 'Only when someone runs it by hand', value: manual }
      - label: 'What it lists'
        name: focus
        widget: select
        default: dance
        options:
          - { label: 'Dances and classes (a dance calendar)', value: dance }
          - { label: 'Live music (dancing varies)', value: music }
      - { label: 'Turned on', name: enabled, widget: boolean, default: true }
      - { label: 'Feed address (optional)', name: feedUrl, widget: string, required: false, hint: 'Calendar feed (.ics), event list page or data address the program reads, if different from the web address.' }
      - { label: 'Extra pages to read', name: pageUrls, widget: list, required: false, hint: 'Full web addresses, one per line (event pages, month pages).' }
      - label: 'Facts to use when a listing leaves them out'
        name: defaults
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 'Venue', name: venueId, widget: relation, collection: venues, value_field: '{{slug}}', search_fields: [name, town, aliases], display_fields: ['{{name}}, {{town}}'], required: false }
          - { label: 'Town', name: town, widget: string, required: false }
          - { label: 'Organizer', name: organizerId, widget: relation, collection: organizers, value_field: '{{slug}}', search_fields: [name, aliases], display_fields: [name], required: false }
          - { label: 'Bands and DJs', name: performerIds, widget: relation, collection: performers, value_field: '{{slug}}', search_fields: [name, aliases], display_fields: [name], multiple: true, required: false }
          - { label: 'Dance styles', name: danceStyles, <<: *style-relation, required: false }
          - { label: 'Type of event', name: category, widget: select, required: false, options: [social-dance, class-lesson, lesson-party, live-music, festival] }
      - { label: 'Only keep listings matching', name: include, widget: string, required: false, hint: 'Advanced. A pattern (regular expression), for example "swing|lindy". Leave blank to keep everything.' }
      - { label: 'Skip listings matching', name: exclude, widget: string, required: false, hint: 'Advanced. A pattern (regular expression), for example "comedy|trivia".' }
      - label: 'Catalog status'
        name: catalogStatus
        widget: select
        required: false
        options:
          - { label: 'Live on the site', value: live }
          - { label: 'Being built', value: in-progress }
          - { label: 'Checked, ready to build', value: verified }
          - { label: 'Check again from the automatic run', value: recheck-from-ci }
          - { label: 'Needs the owner''s permission', value: needs-permission }
          - { label: 'Added by hand (flyers, emails)', value: manual-intake }
          - { label: 'Check again when the season starts', value: seasonal-recheck }
      - label: 'Permission to read this site'
        name: permission
        widget: object
        required: false
        collapsed: true
        fields:
          - label: 'Status'
            name: status
            widget: select
            options:
              - { label: 'Not needed (the site allows it)', value: not-needed }
              - { label: 'Needed, not asked yet', value: needed }
              - { label: 'Asked, waiting for an answer', value: requested }
              - { label: 'Allowed', value: granted }
              - { label: 'Said no', value: denied }
          - { label: 'Note', name: note, widget: text, required: false }
          - { label: 'Asked on', name: requestedAt, <<: *date, required: false }
          - { label: 'Answered on', name: decidedAt, <<: *date, required: false }
          - { label: 'Feed they gave us', name: feedUrl, widget: string, required: false }
      - { label: 'Credit shown on the Sources page', name: attribution, widget: text }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Seconds between requests', name: rateLimitSeconds, widget: number, value_type: int, min: 1, max: 60, default: 3 }
      - { label: 'Last run', name: lastScraped, widget: string, required: false, hint: 'Filled in by the weekly scrape.' }
      - { label: 'Last result', name: lastStatus, widget: select, options: [never, ok, empty, invalid, error, skipped], default: never }
      - { label: 'Last message', name: lastMessage, widget: text, required: false }
      - label: 'Last counts'
        name: lastCounts
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: 'Found', name: found, widget: number, value_type: int }
          - { label: 'Kept', name: kept, widget: number, value_type: int }
          - { label: 'Outside Long Island', name: outOfArea, widget: number, value_type: int }
          - { label: 'Needs review', name: needsReview, widget: number, value_type: int }
      - *review

  - name: styles
    label: Dance styles
    label_singular: Dance style
    folder: src/content/styles
    extension: yml
    format: yml
    create: true
    identifier_field: name
    sortable_fields: [order, name]
    media_folder: '/src/assets/entities/styles'
    public_folder: '../../assets/entities/styles'
    fields:
      - { label: 'Name', name: name, widget: string }
      - { label: 'Family', name: family, widget: select, options: [swing, ballroom, latin, tango, country, other] }
      - label: 'Kind of dancing'
        name: danceType
        widget: select
        default: partner
        options:
          - { label: 'Partner dancing', value: partner }
          - { label: 'Line dancing', value: line }
          - { label: 'Party dancing (freestyle)', value: freestyle }
      - { label: 'Order', name: order, widget: number, value_type: int, default: 50 }
      - *aliases
      - { label: 'Short explanation', name: summary, widget: text, hint: 'One or two plain sentences, under 240 characters.' }
      - { label: 'More detail', name: description, widget: text, required: false }
      - { label: 'Music', name: music, widget: string, required: false }
      - { <<: *photos, hint: 'Up to 6 photos of adults dancing this style. Openly licensed photos (for example from Wikimedia Commons) need the author and license in the credit.' }
      - label: 'Learn more links'
        name: moreLinks
        widget: list
        required: false
        hint: 'For example a Wikipedia article about the dance.'
        fields:
          - { label: 'Label', name: label, widget: string }
          - { label: 'Web address', name: url, widget: string }
      - { <<: *evidence, label: 'Sources for these details' }

  - name: faqs
    label: Frequently Asked Questions
    label_singular: Question
    folder: src/content/faqs
    extension: yml
    format: yml
    create: true
    identifier_field: question
    sortable_fields: [order, question]
    fields:
      - { label: 'Question', name: question, widget: string }
      - { label: 'Answer', name: answer, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
      - { label: 'Group', name: category, widget: select, options: [{ label: 'Finding events', value: finding-events }, { label: 'Going dancing', value: going-dancing }, { label: 'About the listings', value: listings }, { label: 'About this site', value: about-site }] }
      - { label: 'Order', name: order, widget: number, value_type: int, default: 50 }
      - { label: 'Published', name: published, widget: boolean, default: true }
      - { label: 'Notes for editors', name: editorialReview, widget: text, required: false }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    create: false
    fields:
      - { label: 'Title', name: title, widget: string }
      - { label: 'Heading', name: heading, widget: string, required: false }
      - { label: 'Intro', name: lede, widget: text, required: false }
      - *seo
      - { label: 'Image', name: image, widget: image, required: false }
      - { label: 'Image alt text', name: imageAlt, widget: string, required: false }
      - label: 'Highlights'
        name: highlights
        widget: list
        required: false
        fields:
          - { label: 'Title', name: title, widget: string }
          - { label: 'Text', name: text, widget: text }
      - { label: 'Notes for editors', name: editorialReview, widget: text, required: false }
      - { label: 'Body', name: body, widget: markdown }

  - name: gallery
    label: Photos
    label_singular: Photo album
    folder: src/content/gallery
    extension: yml
    format: yml
    create: true
    fields:
      - { label: 'Title', name: title, widget: string }
      - { label: 'Date', name: date, <<: *date, required: false }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Order', name: order, widget: number, value_type: int, default: 50 }
      - { label: 'Published', name: published, widget: boolean, default: true }
      - { label: 'Show in a homepage slideshow', name: homepageSlideshow, widget: boolean, default: false }
      - label: 'Photos'
        name: images
        widget: list
        fields:
          - { label: 'Photo', name: image, widget: image }
          - { label: 'Alt text', name: alt, widget: string, hint: 'Describe the photo for people who cannot see it.' }
          - { label: 'Caption', name: caption, widget: string, required: false }
          - { label: 'Credit', name: credit, widget: string, required: false }
          - { label: 'Credit link', name: creditUrl, widget: string, required: false }
          - { label: 'License link (Creative Commons photos only)', name: licenseUrl, widget: string, required: false }
          - { label: 'Original file address (not shown)', name: imageSource, widget: string, required: false }
          - { label: 'Focus point', name: focus, widget: string, required: false, pattern: ['^\d{1,3}% \d{1,3}%$', 'Two percentages, for example 50% 30%'] }
          - { label: 'Short silent video', name: video, widget: string, required: false }
      - { label: 'Where the photos came from', name: source, widget: string, required: false }
      - { label: 'Permission or license', name: rightsNote, widget: text, required: false }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: src/content/settings/site.yml
        fields:
          - { label: 'Site name', name: siteName, widget: string }
          - { label: 'Short name', name: shortName, widget: string }
          - { label: 'Region', name: region, widget: string }
          - { label: 'Tagline', name: tagline, widget: string }
          - { label: 'Description (for search engines)', name: description, widget: text }
          - { label: 'Mission', name: mission, widget: text }
          - { label: 'Repository address', name: repoUrl, widget: string }
          - { label: 'Public email (optional)', name: email, widget: string, required: false }
          - { label: 'Facebook page or group', name: facebookUrl, widget: string, required: false }
          - { label: 'Facebook label', name: facebookLabel, widget: string, required: false }
          - { label: 'Time zone', name: timezone, widget: string, default: 'America/New_York' }
          - { label: 'Counties', name: counties, widget: select, multiple: true, options: [Nassau, Suffolk] }
          - label: 'Map center'
            name: mapCenter
            widget: object
            fields:
              - { label: 'Latitude', name: lat, widget: number, value_type: float }
              - { label: 'Longitude', name: lng, widget: number, value_type: float }
          - { label: 'Farthest venue from the map center (km)', name: maxDistanceKm, widget: number, value_type: int }
          - { label: 'Default social image', name: socialImage, widget: image, required: false }
          - { label: 'Social image alt text', name: socialImageAlt, widget: string, required: false }
