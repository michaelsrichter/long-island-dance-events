  - Salsa On2
  - On2
  - Salsa/Mambo
  - Mambo
summary: A fast, fun partner dance from the Caribbean and New York, with lots of turns.
music: Salsa and Latin jazz
description: Salsa is a lively partner dance with quick footwork and many spins and turns, where the leader guides the follower through turn patterns. It grew out of Cuban dances like son, mambo and cha-cha, and took shape in New York in the 1960s and 1970s along with salsa music. Styles include New York (On2), Los Angeles (On1) and Cuban.
