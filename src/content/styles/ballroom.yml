summary: Classic partner dances that travel around the floor, like the waltz and foxtrot.
music: Waltzes, big-band standards, ballads
description: Ballroom here means the smooth partner dances that travel counterclockwise around the floor, like the waltz, foxtrot, quickstep and Viennese waltz. Couples usually dance in a closed hold. The waltz came from German-speaking Europe in the 1700s, and the foxtrot began in the United States in the 1910s.
