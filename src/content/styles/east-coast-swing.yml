  - Swing Dancing
summary: A simple, bouncy swing dance. It is often the first partner dance people learn.
music: Swing, rock and roll, oldies
description: East Coast Swing is a bouncy swing dance with a six-count basic step made of triple steps and a rock step. Dance studios such as Arthur Murray created it in the 1940s as a simpler, easier-to-teach version of the Lindy Hop. It fits fast swing, rock and roll and rockabilly music.
