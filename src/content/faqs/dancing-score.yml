question: Will people be dancing? What is the dancing score?
answer: |-
  Dance-calendar events and classes are always dancing. For live music at bars, restaurants, parks and theaters, we give a **dancing score out of 10**, because not every show has room or a crowd that dances.

  The score looks at three things:

  - **The venue.** Does it have a dance floor, room near the band, or only seats? We check the venue's website, reviews and public photos.
  - **The band or DJ.** Do they play for dancers (a party band or DJ), or is it a show people sit and watch (many tribute concerts, jazz and acoustic shows)?
  - **The listing.** "Dance party" raises the score. A theater or library concert lowers it.

  **7 to 10** means dancing is likely. **4 to 6** means some people dance. **Below 4** means it is mostly a show to listen to. Shows that are mostly for listening are left out of the main list; choose **Live music** or **Everything** to see them.

  The score is our best guess, not a promise. Each event page says why we think so and links to what we checked. If dancing matters to you, ask the venue. [Tell us](/sources/#corrections) if we got it wrong.
