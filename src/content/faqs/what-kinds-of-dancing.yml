question: What do "Partner dancing", "Line dancing" and "Party dancing" mean?
answer: |-
  **Partner dancing** means two people dance together with steps you can learn, like swing, salsa, hustle, tango or ballroom. You can come alone; people ask each other to dance.

  **Line dancing** means everyone does the same steps in rows, often to country music. No partner is needed.

  **Party dancing** (freestyle) means dancing however you like to a band or DJ, like at a club, bar or wedding. There are no steps to learn.

  Use the **Kind of dancing** filter on the [events list](/events/) to see just one kind.
