question: What do the event types mean?
answer: A **social dance** is a night of dancing, usually with a DJ. A **class or lesson** is when a teacher shows you steps. **Lesson + dance party** means a short group lesson first, then open dancing. **Live music** means a band or singer plays. A **festival** is a bigger event, often a whole day or weekend.
