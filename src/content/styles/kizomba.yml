  - Urbankiz
  - Semba
  - Tarraxinha
summary: A slow, smooth partner dance from Angola, danced close together.
music: Kizomba and Afro-Latin music
description: Kizomba is a slow, smooth partner dance from Angola, done in a close embrace with soft knees and small, grounded steps. It grew in the late 1970s and 1980s, when Angolan semba steps were adapted to the slower kizomba music. The name means "party" in the Kimbundu language. Urban kiz is a newer, more modern style.
