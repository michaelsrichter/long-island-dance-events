summary: A fast, spinning partner dance from the 1970s disco days. It was born in New York.
music: Disco, funk, freestyle, pop
description: Hustle is a smooth, fast-spinning partner dance done to disco music. Puerto Rican teenagers in the South Bronx started it in the early 1970s, first as the Latin hustle and later the New York hustle. It spread worldwide after the 1977 film Saturday Night Fever.
