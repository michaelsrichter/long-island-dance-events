summary: Ballroom versions of Latin dances, like the cha-cha and rumba. Hips move a lot.
music: Latin pop, ballroom Latin
description: Latin and Rhythm are the ballroom versions of dances like the cha-cha, rumba, samba, paso doble and jive. Couples mostly stay in one spot and use quick footwork and a lot of hip motion. Many of these dances come from Cuba and other parts of Latin America; the cha-cha grew out of Cuban dance music in the early 1950s.
