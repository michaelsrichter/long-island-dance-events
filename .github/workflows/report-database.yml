name: Report database (SQLite)

# Builds data/li-dance.sqlite from the files in git (src/content/**, the Long Island places list and
# catalog/sources.json) and saves it as a download on the run page, with a Markdown report of the
# sample queries in catalog/queries.sql. The JSON files stay the master copy; this database is a
# read-only copy for reports. It is rebuilt every time and never committed.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'catalog/**'
      - 'src/data/long-island-places.json'
  pull_request:
    paths:
      - 'catalog/schema.sql'
      - 'catalog/queries.sql'
      - 'catalog/scripts/build-sqlite.ts'
  schedule:
    - cron: '0 12 1 * *' # monthly copy for the record
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build li-dance.sqlite and run the sample reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build the database (fails on integrity or foreign-key errors)
        run: npx tsx catalog/scripts/build-sqlite.ts
      - name: Show the report on the run page
        run: cat data/li-dance-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: li-dance-sqlite
          path: |
            data/li-dance.sqlite
            data/li-dance-report.md
            catalog/queries.sql
          retention-days: 90
