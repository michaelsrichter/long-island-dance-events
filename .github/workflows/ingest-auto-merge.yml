name: Publish collected events

# The collector dispatches this workflow from main with the exact rolling-branch SHA after it starts
# CI. The script independently finds a successful workflow_dispatch CI run for that SHA, then repeats
# every pull-request, repository and content-only guard immediately before the merge.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact ingest/updates commit that CI must pass
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: publish-collected-events
  cancel-in-progress: false

jobs:
  merge:
    name: Merge the checked collection update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Verify and merge the exact checked content update
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: node .github/scripts/auto-merge-ingest.mjs
