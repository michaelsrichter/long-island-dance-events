name: Brazilian Zouk
family: latin
danceType: partner
order: 34
aliases:
  - Zouk
  - Brazilian Zouk
  - Lambazouk
summary: A flowing Brazilian partner dance with big body waves and head movements.
music: Zouk, R&B, pop remixes
description: Brazilian Zouk is a flowing partner dance with smooth body waves, tilted turns and big upper-body and head movements for the follower. It began in Brazil in the early 1990s, when Lambada dancers started dancing to zouk music from the French Caribbean. Today it is also danced to R&B, pop and remixes, and leaves lots of room to improvise.
