name: Azure Static Web Apps

# Production deploys on every merge to main. Pull requests get a preview environment
# (Free plan: up to 3 at a time). A nightly rebuild keeps "upcoming" lists and the
# homepage "next dance" current, and advances recurring-series dates.
# Until infra/deploy.ps1 has stored the AZURE_STATIC_WEB_APPS_API_TOKEN secret, the site is
# still built (as a check) but the deploy and smoke-test steps are skipped.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  schedule:
    - cron: '15 9 * * *' # early morning in U.S. Eastern time; change to suit your time zone
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      HAS_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.org' }}
          # Keep search engines away until launch (set ALLOW_INDEXING=true afterwards).
          ALLOW_INDEXING: ${{ github.event_name == 'pull_request' && 'false' || vars.ALLOW_INDEXING || 'false' }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
          PUBLIC_ANALYTICS_CONSENT_MODE: ${{ vars.PUBLIC_ANALYTICS_CONSENT_MODE || 'opt-in' }}
          PUBLIC_TELEMETRY_ENDPOINT: ${{ vars.PUBLIC_TELEMETRY_ENDPOINT }}
          PUBLIC_RELEASE: ${{ github.sha }}
      - name: Deployment not configured yet
        if: env.HAS_SWA_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so the deploy was skipped. Run infra/deploy.ps1 (see docs/deployment.md)."
      - name: Deploy to Azure Static Web Apps
        id: deploy
        if: env.HAS_SWA_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
      - name: Smoke test the deployed site
        if: env.HAS_SWA_TOKEN == 'true'
        run: |
          sleep 20
          node scripts/smoke.mjs "${{ steps.deploy.outputs.static_web_app_url }}"

  close_preview:
    name: Close preview environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        if: env.HAS_SWA_TOKEN == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: dist
