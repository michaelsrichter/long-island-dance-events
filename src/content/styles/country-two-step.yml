summary: A traveling country partner dance with a quick-quick-slow-slow rhythm.
music: Country music
description: The country two-step is a partner dance that travels counterclockwise around the floor to country music, with a quick-quick-slow-slow rhythm. It is the classic dance of Texas dance halls and honky-tonks, which is why many people call it the Texas two-step. It is related to the foxtrot and the polka.
