name: Merengue
family: latin
danceType: partner
order: 32
aliases:
  - Merengue
  - Meringue
summary: An easy Dominican partner dance. You march in place to the beat.
music: Merengue
description: Merengue is the national dance of the Dominican Republic and one of the easiest partner dances to learn. Partners hold each other closely and step in place or walk to a steady one-two beat, with relaxed hip motion and simple turns. It started as a rural dance and later moved into ballrooms and dance clubs.
