question: What do the little badges like DJ, Live band and Free mean?
answer: They tell you what an event has. **DJ** means a DJ plays recorded music. **Live band** means a band or singer plays live. **Lesson** means a lesson or class is included. **Free** means it costs nothing to get in. **Beginners welcome** means it is good for new dancers. **Daytime** means it starts before 5 PM, and **Outdoors** means it is outside, like in a park. On the [events list](/events/), the [month calendar](/events/calendar/) and the [map](/events/map/), tap the same words under **What's there** to see only those events. Your choices stay set when you switch between the list, calendar and map.
